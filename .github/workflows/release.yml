name: Release
# Publishes to npm through trusted publishing when a version tag is pushed.
# npm side: package tensorcode -> Settings -> Trusted publisher -> GitHub Actions
# (organization TensaCo, repository tensacode-ts, workflow release.yml, environment npm).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/tensorcode
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - name: Tag matches package version
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: npm ci
      - name: Publish
        run: |
          tag=latest; [[ "$GITHUB_REF_NAME" == *-* ]] && tag=next
          npm publish --access public --tag "$tag"
      - name: GitHub release
        run: |
          pre=; [[ "$GITHUB_REF_NAME" == *-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $pre
        env:
          GH_TOKEN: ${{ github.token }}
